<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VINØ{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        header { background: #8B0000; color: white; padding: 1rem; }
        nav { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; }
        nav a { color: white; text-decoration: none; margin: 0 1rem; }
        main { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .messages { margin: 1rem 0; }
        .message { padding: 1rem; margin: 0.5rem 0; border-radius: 4px; }
        .message.success { background: #d4edda; color: #155724; }
        .message.error { background: #f8d7da; color: #721c24; }
        .message.warning { background: #fff3cd; color: #856404; }
        footer { background: #333; color: white; text-align: center; padding: 1rem; margin-top: 2rem; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <nav>
            <div>
                <a href="{% url 'catalog:wine_list' %}"><strong>VINØ</strong></a>
            </div>
            <div>
                <a href="{% url 'catalog:wine_list' %}">Catalog</a>
                <a href="/admin/">Admin</a>
            </div>
        </nav>
    </header>

    {% if messages %}
        <div class="messages" style="max-width: 1200px; margin: 0 auto; padding: 0 1rem;">
            {% for message in messages %}
                <div class="message {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 VINØ.</p>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
